<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MozLove Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ece5dd;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
        }

        .aba {
            display: none;
            height: calc(100vh - 60px);
            overflow-y: auto;
            padding: 15px;
        }

        .aba::-webkit-scrollbar {
            width: 6px;
        }

        .aba::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .aba::-webkit-scrollbar-thumb {
            background: #075e54;
            border-radius: 3px;
        }

        .ativa {
            display: block;
        }

        #caixa {
            min-height: calc(100vh - 180px);
            padding: 10px 15px 70px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            position: relative;
            word-break: break-word;
            line-height: 1.4;
        }

        .minha {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .recebida {
            background: white;
            align-self: flex-start;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        .msg-meta {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .msg-actions {
            position: absolute;
            top: 4px;
            right: 6px;
            cursor: pointer;
            color: #aaa;
            font-size: 18px;
            line-height: 1;
            user-select: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .msg:hover .msg-actions {
            opacity: 1;
        }

        .contato-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 0.5px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .contato-item:hover {
            background: #f9f9f9;
        }

        .contato-nome {
            cursor: pointer;
            flex: 1;
            color: #075e54;
            font-weight: 500;
        }

        .contato-nome small {
            display: block;
            color: #888;
            font-weight: normal;
            font-size: 12px;
            margin-top: 2px;
        }

        .contato-del {
            cursor: pointer;
            color: #aaa;
            font-size: 20px;
            padding: 0 4px;
            user-select: none;
            transition: color 0.15s;
        }

        .contato-del:hover {
            color: #d32f2f;
        }

        .input-row {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: white;
            padding: 8px 10px;
            display: flex;
            gap: 6px;
            border-top: 1px solid #e0e0e0;
            z-index: 100;
        }

        .input-row input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border 0.15s;
        }

        .input-row input:focus {
            border-color: #075e54;
        }

        #para {
            width: 28%;
        }

        #txt {
            flex: 1;
        }

        .input-row button {
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.15s;
        }

        .input-row button:hover {
            background: #064a42;
        }

        .input-row button:active {
            background: #052e2a;
            transform: scale(0.95);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.15s;
        }

        .form-group input:focus {
            border-color: #075e54;
        }

        .btn-verde {
            width: 100%;
            padding: 12px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }

        .btn-verde:hover {
            background: #064a42;
        }

        .btn-verde:active {
            background: #052e2a;
            transform: scale(0.98);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #075e54;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #064a42;
            z-index: 200;
        }

        .bottom-nav button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 12px;
            border-radius: 8px;
            opacity: 0.75;
            transition: opacity 0.15s;
            outline: none;
        }

        .bottom-nav button.ativo {
            opacity: 1;
            border-bottom: 3px solid #25d366;
        }

        .bottom-nav button:hover {
            opacity: 1;
        }

        .bottom-nav button:active {
            transform: scale(0.95);
        }

        h2 {
            font-size: 18px;
            color: #075e54;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            padding: 30px 0;
            font-size: 14px;
        }

        .perfil-tag {
            background: #e9f5f0;
            color: #075e54;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block;
        }

        .ativo-badge {
            font-size: 11px;
            color: #25d366;
            margin-left: 6px;
            font-weight: 600;
        }

        .perfil-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-usar {
            font-size: 12px;
            padding: 4px 8px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-usar:hover {
            background: #064a42;
        }

        @media (max-width: 600px) {
            #para {
                width: 35%;
            }

            .msg {
                max-width: 90%;
            }

            .bottom-nav button span {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div id="chat" class="aba ativa">
    <div class="header">💬 MozLove Hub</div>
    <div id="caixa"></div>
    <div class="input-row">
        <input id="para" placeholder="Destino (ID)" autocomplete="off">
        <input id="txt" placeholder="Escreva uma mensagem..." autocomplete="off" onkeydown="if(event.key==='Enter')enviar()">
        <button onclick="enviar()" title="Enviar">➤</button>
    </div>
</div>

<div id="contactos" class="aba">
    <h2>Contactos</h2>
    <div class="form-group">
        <input id="nome_contato" placeholder="Nome do contacto" onkeydown="if(event.key==='Enter')document.getElementById('num_contato').focus()">
    </div>
    <div class="form-group">
        <input id="num_contato" placeholder="Número / ID" onkeydown="if(event.key==='Enter')adicionarContato()">
    </div>
    <button class="btn-verde" onclick="adicionarContato()">+ Adicionar Contacto</button>
    <br><br>
    <div id="lista_contactos"></div>
</div>

<div id="perfil" class="aba">
    <h2>Perfil</h2>
    <div class="form-group">
        <input id="nome_novo" placeholder="O seu nome" onkeydown="if(event.key==='Enter')criarPerfil()">
    </div>
    <button class="btn-verde" onclick="criarPerfil()">+ Criar Perfil</button>
    <br><br>
    <div id="lista_perfis"></div>
</div>

<div class="bottom-nav">
    <button id="nav-chat" class="ativo" onclick="mostrarAba('chat')">💬<span>Chat</span></button>
    <button id="nav-contactos" onclick="mostrarAba('contactos')">👥<span>Contactos</span></button>
    <button id="nav-perfil" onclick="mostrarAba('perfil')">👤<span>Perfil</span></button>
</div>

<script>
    let abaAtual = 'chat';
    let intervalo = null;

    function getItem(k, def) {
        try {
            return JSON.parse(localStorage.getItem(k)) || def;
        } catch (e) {
            return def;
        }
    }

    function setItem(k, v) {
        localStorage.setItem(k, JSON.stringify(v));
    }

    function ativoID() {
        return localStorage.getItem('ativo') || null;
    }

    function mostrarAba(id) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('ativo'));
        document.getElementById(id).classList.add('ativa');
        document.getElementById('nav-' + id).classList.add('ativo');
        abaAtual = id;
        if (id === 'chat') {
            rolarFim();
        }
    }

    function rolarFim() {
        const c = document.getElementById('caixa');
        if (c) {
            setTimeout(() => {
                c.scrollTop = c.scrollHeight;
            }, 0);
        }
    }

    function renderizarContactos() {
        const lista = getItem('contactos', []);
        const el = document.getElementById('lista_contactos');
        if (!lista.length) {
            el.innerHTML = '<div class="empty-state">Sem contactos ainda.<br><br>Use a aba Contactos para adicionar.</div>';
            return;
        }
        el.innerHTML = lista.map((c, i) => `
            <div class="contato-item">
                <div class="contato-nome" onclick="preencher('${c.num}')" title="Enviar mensagem">
                    <strong>${c.nome}</strong>
                    <small>${c.num}</small>
                </div>
                <div class="contato-del" onclick="eliminarContacto(${i})" title="Eliminar">🗑</div>
            </div>`).join('');
    }

    function eliminarContacto(i) {
        if (!confirm('Eliminar este contacto?')) return;
        const lista = getItem('contactos', []);
        lista.splice(i, 1);
        setItem('contactos', lista);
        renderizarContactos();
    }

    function renderizarPerfis() {
        const lista = getItem('perfis', []);
        const el = document.getElementById('lista_perfis');
        const atual = ativoID();
        if (!lista.length) {
            el.innerHTML = '<div class="empty-state">Nenhum perfil criado.<br><br>Crie um perfil para começar a usar a app.</div>';
            return;
        }
        el.innerHTML = lista.map((p, i) => `
            <div class="contato-item">
                <div style="flex:1">
                    <strong>${p.nome}</strong>
                    ${p.num === atual ? '<span class="ativo-badge">✔ activo</span>' : ''}
                    <br>
                    <span class="perfil-tag">ID: ${p.num}</span>
                </div>
                <div class="perfil-buttons">
                    ${p.num !== atual ? `<button class="btn-usar" onclick="usarPerfil('${p.num}')">Usar</button>` : ''}
                    <div class="contato-del" onclick="eliminarPerfil(${i})" title="Eliminar">🗑</div>
                </div>
            </div>`).join('');
    }

    function usarPerfil(num) {
        localStorage.setItem('ativo', num);
        renderizarPerfis();
        alert('Perfil alterado com sucesso!');
    }

    function eliminarPerfil(i) {
        if (!confirm('Eliminar este perfil?')) return;
        const lista = getItem('perfis', []);
        const atual = ativoID();
        if (lista[i] && lista[i].num === atual) {
            localStorage.removeItem('ativo');
        }
        lista.splice(i, 1);
        setItem('perfis', lista);
        renderizarPerfis();
    }

    function criarPerfil() {
        const nome = document.getElementById('nome_novo').value.trim();
        if (!nome) {
            alert('Por favor, introduza um nome.');
            return;
        }
        const num = '0000-' + Math.floor(1000 + Math.random() * 9000);
        const lista = getItem('perfis', []);
        lista.push({ nome, num });
        setItem('perfis', lista);
        if (!ativoID()) {
            localStorage.setItem('ativo', num);
        }
        document.getElementById('nome_novo').value = '';
        renderizarPerfis();
        alert('Perfil criado: ' + nome);
    }

    function adicionarContato() {
        const nome = document.getElementById('nome_contato').value.trim();
        const num = document.getElementById('num_contato').value.trim();
        if (!nome || !num) {
            alert('Por favor, preencha nome e número.');
            return;
        }
        const lista = getItem('contactos', []);
        lista.push({ nome, num });
        setItem('contactos', lista);
        document.getElementById('nome_contato').value = '';
        document.getElementById('num_contato').value = '';
        renderizarContactos();
        alert('Contacto adicionado: ' + nome);
    }

    function preencher(num) {
        document.getElementById('para').value = num;
        mostrarAba('chat');
        document.getElementById('txt').focus();
    }

    function enviar() {
        const atual = ativoID();
        if (!atual) {
            alert('Crie e seleccione um perfil primeiro para enviar mensagens.');
            mostrarAba('perfil');
            return;
        }
        const para = document.getElementById('para').value.trim();
        const texto = document.getElementById('txt').value.trim();
        if (!para || !texto) {
            alert('Por favor, preencha destino e mensagem.');
            return;
        }
        const msgs = getItem('msgs', []);
        msgs.push({ de: atual, para, texto, hora: Date.now() });
        setItem('msgs', msgs);
        document.getElementById('txt').value = '';
        carregar();
        rolarFim();
    }

    function formatarHora(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const h = d.getHours().toString().padStart(2, '0');
        const m = d.getMinutes().toString().padStart(2, '0');
        return h + ':' + m;
    }

    function carregar() {
        const atual = ativoID();
        const msgs = getItem('msgs', []);
        const caixa = document.getElementById('caixa');
        const eraFundo = caixa.scrollTop + caixa.clientHeight >= caixa.scrollHeight - 10;

        if (!msgs.length) {
            caixa.innerHTML = '<div class="empty-state" style="margin-top:40px">Nenhuma mensagem ainda.<br><br>Seleccione um contacto e comece a conversar!</div>';
        } else {
            caixa.innerHTML = msgs.map((m, i) => `
                <div class="msg ${m.de === atual ? 'minha' : 'recebida'}">
                    <div class="msg-actions" onclick="eliminarMensagem(${i})">×</div>
                    <div>${m.texto}</div>
                    <div class="msg-meta">${formatarHora(m.hora)}</div>
                </div>`).join('');
        }

        if (eraFundo) {
            rolarFim();
        }
    }

    function eliminarMensagem(i) {
        if (!confirm('Eliminar esta mensagem?')) return;
        const msgs = getItem('msgs', []);
        msgs.splice(i, 1);
        setItem('msgs', msgs);
        carregar();
    }

    // Inicialização
    window.addEventListener('load', () => {
        carregar();
        renderizarContactos();
        renderizarPerfis();
        if (intervalo) clearInterval(intervalo);
        intervalo = setInterval(carregar, 2000);
    });

    // Limpeza ao fechar
    window.addEventListener('beforeunload', () => {
        if (intervalo) clearInterval(intervalo);
    });
</script>

</body>
</html>
